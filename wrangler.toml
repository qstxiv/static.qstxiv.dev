name = "static-qstxiv-dev"
main = "src/index.js"
workers_dev = true # used for test.py
compatibility_date = "2023-09-04"
routes = [
  { pattern = "static.qstxiv.dev", custom_domain = true }
]
kv_namespaces = [
  { binding = "KV", id = "697fd977e3744238b840cbb2bd07c5af", preview_id = "19d2d1f2b9a84b448ef9b84aab815377" },
  { binding = "AUTH", id = "ce6bdc1de15545478873f789f0f71052", preview_id = "dbf79a63fa354cf4913704d6e00ba1ec" }
]
r2_buckets = [
  { binding = "FILES", bucket_name = "qstxiv", preview_bucket_name = "qstxiv-preview" }
]

[vars]
REDIR_URL = "https://github.com/PunishXIV/Questionable"

[[analytics_engine_datasets]]
binding = "METRICS"
